version: 2

# Dependabot reads this file from the default branch only, so it lives on dev and reaches
# main through the promotion. Each release line gets its own update PRs through
# target-branch: dev for Filament 4 and 5, filament-3 for Filament 3.
#
# composer.lock is not committed (this is a library), so Composer updates only happen when
# a new release falls outside a constraint. "widen" then adds the new range to the old one
# instead of dropping the old one. Filament's own majors are ignored: each branch is tied
# to its Filament line, and moving to the next Filament means a new branch, not a bump.
#
# Every entry waits 7 days after a release before proposing it, and groups everything into
# one PR per ecosystem per branch.

updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-dev:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: filament-3
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions-filament-3:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: widen
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: filament/filament
        update-types: ["version-update:semver-major"]
    groups:
      composer-dev:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: "/"
    target-branch: filament-3
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    versioning-strategy: widen
    commit-message:
      prefix: chore
      include: scope
    # Filament 3 runs on Livewire 3 and at most Laravel 12, and Testbench 11 is Laravel 13,
    # so their majors would break this line the same way a Filament major would.
    ignore:
      - dependency-name: filament/filament
        update-types: ["version-update:semver-major"]
      - dependency-name: livewire/livewire
        update-types: ["version-update:semver-major"]
      - dependency-name: orchestra/testbench
        update-types: ["version-update:semver-major"]
    groups:
      composer-filament-3:
        patterns: ["*"]
