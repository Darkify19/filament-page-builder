name: CI

on:
  push:
    branches: [main, dev]
  # Pull requests target dev. The bot's dev-to-main promotion PR merges within seconds,
  # and every run for it failed as a "workflow file issue" before a job started. The
  # push to dev has already run the suite on the same commits.
  pull_request:
    branches: [dev]

jobs:
  quality:
    name: Tests (Filament ${{ matrix.filament }})
    runs-on: ubuntu-latest

    # The floor, the newest 4.x and the newest 5.x. Filament 4 runs on Livewire 3 and
    # Filament 5 on Livewire 4, so each row pins its own pair. The floor is the first 4.x
    # without a security advisory: Composer refuses to install anything older by default.
    strategy:
      fail-fast: false
      matrix:
        include:
          - filament: '~4.12.6'
            livewire: '^3.6'
            testbench: '^10.0'
          - filament: '^4.12.6'
            livewire: '^3.6'
            testbench: '^10.0'
          - filament: '^5.0'
            livewire: '^4.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction "filament/filament:${{ matrix.filament }}"
          composer require --dev --no-update --no-interaction \
            "livewire/livewire:${{ matrix.livewire }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Lint PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest --compact
