name: CI

on:
  push:
    branches: [main, dev]
  # Pull requests target dev. The bot's dev-to-main promotion PR merges within seconds,
  # and every run for it failed as a "workflow file issue" before a job started. The
  # push to dev has already run the suite on the same commits.
  pull_request:
    branches: [dev]

jobs:
  quality:
    name: Lint and static checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest --compact
