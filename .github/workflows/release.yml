name: Release

# Packagist reads tags on its own. The GitHub Release is for people: pushing a
# semver tag publishes one, so every version has notes to read.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # Latest goes to the highest version, not the newest tag: a patch on the Filament 3
          # line (0.3.x) must not take it from the Filament 4/5 line.
          make_latest: legacy
          # v1.0.0-beta.1 and similar stay marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
